# CI do AOS (AOS-010) — gates de qualidade fail-closed.
#
# A FONTE DE VERDADE dos gates é LOCAL e testável: scripts/ci/*.sh. Este workflow
# apenas os INVOCA — nenhuma lógica de gate é duplicada aqui. Reproduz-se
# localmente por um único comando: `make ci` (ver CONTRIBUTING.md).
#
# Fail-closed: cada job corre um gate cujo script termina com exit != 0 em falha,
# o que marca o check como vermelho. NÃO há `continue-on-error` nem mascaramento.
# Como não há remote configurado, este YAML é configuração declarativa; a
# validação real dos gates é o runner local.
#
# ─── REQUIRED CHECKS (bloqueiam o merge na branch principal) ──────────────────
# Configurar em Settings → Branches → branch protection de `main`, exigindo os
# checks: build · lint · test · replay · memory · supplychain · routing · apex · security · evalgate · scale · dr-e2e · ux-dx · sast · sca · policy-test · gates. O job `gates`
# agrega os anteriores para um único gate obrigatório conveniente. O scan de
# segredos (regra transversal de specs/01 §4) é pré-condição de merge e corre em
# `lint` como passo dedicado.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CGO_ENABLED: "1"     # -race exige CGO (gcc presente por omissão nos runners ubuntu)
  GOTOOLCHAIN: local

jobs:
  # Gate de segredos — pré-condição de merge (specs/01 §4). O runner local
  # (scripts/ci/secrets.sh) é a fonte de verdade; gitleaks é um scan profundo extra.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate secrets (chaves privadas / ficheiros de segredo rastreados)
        run: bash scripts/ci/secrets.sh
      - name: Scan profundo (gitleaks)
        uses: gitleaks/gitleaks-action@v2

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate build
        run: bash scripts/ci/build.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate lint (+ arch-lint AOS-003)
        run: bash scripts/ci/lint.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate test (-race + cobertura kernel >= 80%)
        run: bash scripts/ci/test.sh

  # Gate 8 — replay determinístico + idempotência por passo (harness AOS-024).
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate replay (fidelidade 100% + zero efeitos duplicados)
        run: bash scripts/ci/replay.sh

  # Gate de memória — integridade/migração/proveniência (suite AOS-044, fail-closed).
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate memory (integridade/migração/proveniência + shredding/cache)
        run: bash scripts/ci/memory.sh

  # Gate de supply-chain — 7 vectores adversariais + audit WORM (suite AOS-054, o
  # último do EPIC-05). Fail-closed: um vector não-bloqueado torna o gate vermelho.
  supplychain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate supplychain (rug-pull · schema drift · tool poisoning · latest · fora-do-catálogo · replay)
        run: bash scripts/ci/supplychain.sh

  # Gate de roteamento/failover — 5 cenários adversariais + deny cross-border
  # atribuível (suite AOS-063, o último do EPIC-06). Fail-closed: um cenário não
  # tratado (saturação/tiering/degradação/failover/cross-border) torna o gate vermelho.
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate routing (saturação · tiering · degradação · failover intra · cross-border deny)
        run: bash scripts/ci/routing.sh

  # Gate do ápice/composition-root — enforcement composto do módulo packages/integration
  # (AOS-146/147/148, PR-0.a). Fail-closed e não-vazio (require_tests): uma invariante de
  # wiring não-provada (mediação total, fail-closed sem audit, allowlist regional, bloqueio
  # cross-border, freeze por-run) OU a cobertura do módulo abaixo do piso torna-o vermelho.
  apex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate apex (mediação total · fail-closed sem audit · allowlist regional · cross-border deny · freeze)
        run: bash scripts/ci/apex.sh

  # Gate de segurança — 4 cenários adversariais + audit WORM (suite AOS-075, o último do
  # EPIC-07). Fail-closed: um vector não-bloqueado (prompt injection/exfiltração/segredos/
  # isolamento) OU um meta-teste que deixe de detectar torna o gate vermelho.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate security (prompt injection · exfiltração egress/DNS · segredos · isolamento)
        run: bash scripts/ci/security.sh

  # Gate 9 — eval harness + golden-sets curados / admission control comportamental
  # (AOS-114, ADR-012). Fail-closed: um candidato mau admitido, um veredicto não-
  # reprodutível, uma emissão não-ligada ao trace, ou o eval-pass-rate abaixo do alvo
  # (>=90%) avermelha o gate.
  evalgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate evalgate (golden-sets curados + admission control · emit ligado ao trace)
        run: bash scripts/ci/evalgate.sh

  # Gate de carga/escala — 5 cenários (AC1..AC5) + meta-teste não-vácuo (suite AOS-116,
  # EPIC-11). Fail-closed: saturação agregada que oversubscreva, degradação fora de
  # ordem, fila não-limitada, breaker que não dispara, ou o meta-teste a deixar de
  # detectar (admission contornado sem colapso) torna o gate vermelho.
  scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate scale (saturação agregada · degradação em ordem · filas limitadas · breaker · NFRs)
        run: bash scripts/ci/scale.sh

  # Gate de DR/replay end-to-end — teste de fogo (suite AOS-118, o que FECHA o EPIC-11).
  # Fail-closed: perda de evento confirmado, efeito duplicado, failover cross-border, MTTR
  # acima do alvo, ou um meta-teste que deixe de detectar torna o gate vermelho.
  dr-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate dr-e2e (node loss · failover · resume-from-step · zero-loss/zero-dup · soberania · MTTR)
        run: bash scripts/ci/dr-e2e.sh

  # Gate de UX/DX — usabilidade dos gates + anti-fadiga (override-rate AOS-095) + paridade
  # + acessibilidade (suite AOS-128, o que FECHA o EPIC-12). Fail-closed: um gate de
  # usabilidade não coberto, o sinal anti-fadiga a deixar de disparar, a paridade a
  # divergir ou a degradação a não fechar torna o gate vermelho.
  ux-dx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate ux-dx (usabilidade · anti-fadiga override-rate · paridade · acessibilidade)
        run: bash scripts/ci/ux-dx.sh

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate SAST (gosec)
        run: bash scripts/ci/sast.sh

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate SCA (govulncheck)
        run: bash scripts/ci/sca.sh

  policy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate policy-test (PDP golden allow/deny + assinatura)
        run: bash scripts/ci/policy-test.sh

  # Auto-testes dos gates: provam que falhas de lint/test/política/CVE bloqueiam.
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Self-tests dos gates
        run: bash scripts/ci/selftest.sh

  # Gate agregador conveniente para branch protection (required check único).
  gates:
    runs-on: ubuntu-latest
    needs: [secrets, build, lint, test, replay, memory, supplychain, routing, apex, security, evalgate, scale, dr-e2e, ux-dx, sast, sca, policy-test, selftest]
    steps:
      - name: Todos os gates verdes
        run: echo "Todos os gates de CI passaram (fail-closed)."

  # Entrega do artefacto `aos` — não bloqueante até EPIC-10 (visível, mas não
  # required). Corre após os gates para não desperdiçar recursos em código partido.
  delivery:
    runs-on: ubuntu-latest
    needs: [gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate package (empacotamento + sast/sca + imagem distroless)
        run: bash scripts/ci/package.sh
      - name: Gate sbom (SBOM + proveniência mínima)
        run: bash scripts/ci/sbom.sh
      - name: Upload de artefactos de entrega
        uses: actions/upload-artifact@v4
        with:
          name: aos-delivery
          path: deploy/node/build
          if-no-files-found: warn
