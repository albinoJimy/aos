# CI do AOS (AOS-010) — gates de qualidade fail-closed.
#
# A FONTE DE VERDADE dos gates é LOCAL e testável: scripts/ci/*.sh. Este workflow
# apenas os INVOCA — nenhuma lógica de gate é duplicada aqui. Reproduz-se
# localmente por um único comando: `make ci` (ver CONTRIBUTING.md).
#
# Fail-closed: cada job corre um gate cujo script termina com exit != 0 em falha,
# o que marca o check como vermelho. NÃO há `continue-on-error` nem mascaramento.
# Como não há remote configurado, este YAML é configuração declarativa; a
# validação real dos gates é o runner local.
#
# ─── REQUIRED CHECKS (bloqueiam o merge na branch principal) ──────────────────
# Configurar em Settings → Branches → branch protection de `main`, exigindo os
# checks: build · lint · test · replay · memory · supplychain · sast · sca · policy-test · gates. O job `gates`
# agrega os anteriores para um único gate obrigatório conveniente. O scan de
# segredos (regra transversal de specs/01 §4) é pré-condição de merge e corre em
# `lint` como passo dedicado.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CGO_ENABLED: "1"     # -race exige CGO (gcc presente por omissão nos runners ubuntu)
  GOTOOLCHAIN: local

jobs:
  # Gate de segredos — pré-condição de merge (specs/01 §4). O runner local
  # (scripts/ci/secrets.sh) é a fonte de verdade; gitleaks é um scan profundo extra.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate secrets (chaves privadas / ficheiros de segredo rastreados)
        run: bash scripts/ci/secrets.sh
      - name: Scan profundo (gitleaks)
        uses: gitleaks/gitleaks-action@v2

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate build
        run: bash scripts/ci/build.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate lint (+ arch-lint AOS-003)
        run: bash scripts/ci/lint.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate test (-race + cobertura kernel >= 80%)
        run: bash scripts/ci/test.sh

  # Gate 8 — replay determinístico + idempotência por passo (harness AOS-024).
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate replay (fidelidade 100% + zero efeitos duplicados)
        run: bash scripts/ci/replay.sh

  # Gate de memória — integridade/migração/proveniência (suite AOS-044, fail-closed).
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate memory (integridade/migração/proveniência + shredding/cache)
        run: bash scripts/ci/memory.sh

  # Gate de supply-chain — 7 vectores adversariais + audit WORM (suite AOS-054, o
  # último do EPIC-05). Fail-closed: um vector não-bloqueado torna o gate vermelho.
  supplychain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate supplychain (rug-pull · schema drift · tool poisoning · latest · fora-do-catálogo · replay)
        run: bash scripts/ci/supplychain.sh

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate SAST (gosec)
        run: bash scripts/ci/sast.sh

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate SCA (govulncheck)
        run: bash scripts/ci/sca.sh

  policy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Gate policy-test (PDP golden allow/deny + assinatura)
        run: bash scripts/ci/policy-test.sh

  # Auto-testes dos gates: provam que falhas de lint/test/política/CVE bloqueiam.
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "packages/**/go.sum"
      - name: Self-tests dos gates
        run: bash scripts/ci/selftest.sh

  # Gate agregador conveniente para branch protection (required check único).
  gates:
    runs-on: ubuntu-latest
    needs: [secrets, build, lint, test, replay, memory, supplychain, sast, sca, policy-test, selftest]
    steps:
      - name: Todos os gates verdes
        run: echo "Todos os gates de CI passaram (fail-closed)."
