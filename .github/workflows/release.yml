# Release do nó `aos` — constrói, atesta e PUBLICA a imagem; o deploy é o passo seguinte.
#
# Disparo: tag `v*` (ex.: v0.1.0). Um deploy passa a ser sempre rastreável a uma tag assinável
# do repositório, e não a "o que estava em main naquele minuto".
#
# ─── A cadeia, e porque é esta a ordem ────────────────────────────────────────────────────────
#   1. gates      — INVOCA .github/workflows/ci.yml (os 24 gates fail-closed). Não há segunda
#                   definição relaxada dos gates para releases: é a mesma, por `workflow_call`.
#   2. publish    — package.sh constrói a imagem endurecida (mesma fonte de verdade local que
#                   `make ci-package`), sbom.sh gera SBOM+proveniência, sign.sh assina em DSSE,
#                   verify-attestation.sh RECUSA o que não valide, e só então se faz push.
#   3. deploy     — chama deploy.yml, que entra em `production` (environment protegido).
#
# O push para o registry acontece DEPOIS da atestação, nunca antes: publicar primeiro e verificar
# depois deixaria, numa falha, um artefacto não-verificado ao alcance de um `docker pull`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Fazer deploy para o servidor após publicar"
        type: boolean
        default: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/aos-node

jobs:
  # ── 1. Os MESMOS gates da CI ────────────────────────────────────────────────────────────────
  gates:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  # ── 2. Empacotar, atestar, publicar ─────────────────────────────────────────────────────────
  publish:
    needs: [gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # criar a GitHub Release
      packages: write   # push para o GHCR
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: "packages/**/go.sum"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Metadados da release
        id: meta
        run: |
          set -euo pipefail
          # if/else e não `[ ... ] && ...`: o runner corre com `set -e`, e um `&&` cujo teste dá
          # falso devolve 1 como último estado do comando — mataria o passo exactamente no caso
          # normal (um push de tag, em que o teste É falso).
          if [ "${GITHUB_REF}" = "${GITHUB_REF#refs/tags/}" ]; then
            version="0.0.0-$(git rev-parse --short HEAD)"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${REGISTRY,,}/${IMAGE_NAME,,}:${version}" >> "$GITHUB_OUTPUT"

      # package.sh é a fonte de verdade da ENTREGA INTEIRA (imagem distroless non-root, sast/sca/
      # secrets, SBOM, proveniência, assinatura e verificação). O workflow só lhe dá duas coisas:
      # a tag de destino e o CAMINHO da chave. A chave TEM de estar lá ANTES, e não depois.
      #
      # `package.sh` NÃO é um gate isolado: ele próprio ORQUESTRA o sbom, o sign e o
      # verify-attestation como sub-gates (vê-se nos seus logs — `GATE: package · sign`).
      # A versão anterior deste workflow escrevia a chave num passo POSTERIOR e chamava
      # sbom/sign/verify outra vez à mão: o package.sh corria primeiro, sem
      # AOS_RELEASE_KEY_FILE, saltava a assinatura e terminava em VERDE PARCIAL (saída 3) —
      # que é fail-closed correcto do lado do projecto e erro de sequência do lado do workflow.
      #
      # A chave entra por FICHEIRO (sign.sh lê o CAMINHO, nunca o valor) e o caminho vai para
      # $GITHUB_ENV para o package.sh o herdar.
      - name: Provisionar a chave de release (por ficheiro, para o package.sh)
        env:
          AOS_RELEASE_KEY: ${{ secrets.AOS_RELEASE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AOS_RELEASE_KEY:-}" ]; then
            echo "::error::AOS_RELEASE_KEY não provisionada. Sem ela o package.sh termina em VERDE PARCIAL e a entrega NÃO é publicável (ADR-017 ponto 3). Ver deploy/node/CUSTODIA-CHAVE-RELEASE.md."
            exit 1
          fi
          umask 077
          printf '%s' "$AOS_RELEASE_KEY" > "$RUNNER_TEMP/release.key"
          echo "AOS_RELEASE_KEY_FILE=$RUNNER_TEMP/release.key" >> "$GITHUB_ENV"

      # Um único gate: empacota a imagem endurecida, reutiliza sast/sca/secrets, gera SBOM e
      # proveniência, ASSINA a atestação DSSE e RECUSA o que não valide. Fail-closed por
      # construção — qualquer etapa não-verificada dá saída != 0 e aborta a entrega.
      - name: Gate package (empacota · assina · verifica — fail-closed)
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: bash scripts/ci/package.sh

      # `always()`: a chave sai do runner mesmo quando o gate falha.
      - name: Remover a chave do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.key"

      - name: Push para o GHCR
        id: push
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          # Por `env:`, não interpolado no corpo do script: um secret expandido dentro do texto
          # do `run` fica no ficheiro de script que o runner escreve em disco.
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_ACTOR" --password-stdin
          docker push "$TAG"
          # A referência que o servidor vai usar é o DIGEST, não a tag: imutável e reversível.
          digest="$( docker image inspect --format '{{index .RepoDigests 0}}' "$TAG" )"
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          echo "Publicado: $digest"
          docker logout "$REGISTRY"

      - name: Artefactos de entrega
        uses: actions/upload-artifact@v4
        with:
          name: aos-delivery-${{ steps.meta.outputs.version }}
          path: deploy/node/build
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail
          {
            echo "## Imagem"
            echo '```'
            echo "$IMAGE"
            echo '```'
            echo
            echo "## Entrega"
            echo "- Atestação DSSE **assinada e verificada** — o \`package.sh\` é fail-closed:"
            echo "  se a assinatura ou a verificação não corressem, esta release não existiria."
            echo "- SBOM e proveniência no artefacto \`aos-delivery-$VERSION\`."
            echo "- ⚠️ A atestação **não viaja com a imagem** (sem OCI referrers): um \`docker pull\`"
            echo "  não a traz. Residual declarado em ADR-017."
            echo
            echo "## Deploy"
            echo '```bash'
            echo "bash /opt/aos/deploy.sh $IMAGE"
            echo '```'
          } > notes.md
          gh release create "$VERSION" --title "$VERSION" --notes-file notes.md \
            deploy/node/build/sbom.json \
            deploy/node/build/provenance.json \
            deploy/node/build/attestation.dsse.json \
            deploy/node/build/delivery-manifest.json || \
          gh release create "$VERSION" --title "$VERSION" --notes-file notes.md

  # ── 3. Deploy para o servidor (environment protegido) ───────────────────────────────────────
  deploy:
    needs: [publish]
    if: github.event_name == 'push' || inputs.deploy
    uses: ./.github/workflows/deploy.yml
    # OBRIGATÓRIO, e não cosmético: um workflow reutilizável NÃO pode pedir mais permissões do
    # que o job que o chama detém. O deploy.yml declara `contents: read` + `packages: read` (o
    # segundo para o `docker pull` do GHCR). Sem esta lista, este job herdaria o
    # `permissions: contents: read` do nível do workflow — sem `packages` — e o GitHub REJEITA
    # o run INTEIRO com `startup_failure`, a zero segundos, sem jobs, sem logs e sem anotação
    # que o explique. Tem de ser um superconjunto do que o deploy.yml pede.
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.publish.outputs.image }}
    secrets: inherit
