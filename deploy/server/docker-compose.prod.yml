# =============================================================================
# Stack de SERVIDOR do nó `aos` — 37.60.241.150 (ou qualquer host equivalente).
#
# Derivado de deploy/node/dev-hardened/docker-compose.yml, com TRÊS diferenças
# que fazem dele um alvo de CD e não um stack de bancada:
#
#   1. A imagem NÃO é construída aqui — vem por REFERÊNCIA IMUTÁVEL (digest) em
#      ${AOS_IMAGE}, escrita por deploy.sh a partir do que o release publicou.
#      Um deploy é, por construção, a troca de um digest: reprodutível e
#      reversível (ver rollback.sh).
#   2. NENHUM caminho aponta para a árvore do repositório. Tudo o que o nó monta
#      vive em /opt/aos no servidor — o servidor não tem (nem precisa de) o repo.
#   3. NENHUM material PRIVADO está aqui nem chega aqui, com uma única excepção
#      declarada: a chave TLS do edge. As chaves de issuer/operador/ratificador/
#      aprovador ficam na máquina do operador; o servidor só recebe as PUBLICAS
#      (ver README.md §"Onde vive cada chave").
#
# Arranque:  bash /opt/aos/deploy.sh <image-ref>
# Paragem:   docker compose -f /opt/aos/docker-compose.prod.yml --env-file /opt/aos/.env --env-file /opt/aos/image.env down
# =============================================================================
name: aos

services:
  # --- o nó `aos`, endurecido, só na rede interna (cleartext NUNCA publicado) -----------------
  aos:
    image: ${AOS_IMAGE:?AOS_IMAGE por definir — corre deploy.sh, não `docker compose up` à mão}
    restart: unless-stopped
    # FOLGA DE ENCERRAMENTO, declarada AO LADO da env que a consome para que a relação entre
    # as duas fique num sítio só. Sem `stop_grace_period` vale o default do Docker — 10s — e
    # o nó não tem tempo de drenar: o dreno HTTP espera pelos pedidos activos (um SSE de
    # trajectória ocioso nunca fecha sozinho) e o dreno do SERVIÇO, que liberta leases e sela
    # desfechos terminais, corria a seguir e era o que ficava sem tempo.
    #
    # 35s de folga para 30s de orçamento: 5s de margem para tratar o sinal e esvaziar o log.
    # Subir AOS_SHUTDOWN_BUDGET sem subir isto traz o SIGKILL a meio do dreno.
    #
    # NÃO atrasa os deploys no caso normal: `Shutdown` devolve assim que não há ligações
    # activas. A folga só é gasta quando há mesmo trabalho a drenar, que é quando se quer.
    stop_grace_period: 35s
    mem_limit: ${AOS_MEM_LIMIT:-1g}
    pids_limit: 1024
    read_only: true               # root-fs read-only (ADR-017); estado durável só no volume.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      AOS_API_ADDR: "0.0.0.0:8080"

      # Orçamento TOTAL do encerramento gracioso, repartido em dois drenos com prazos
      # SEPARADOS (2/5 para o ingresso HTTP, a maioria para o serviço, que é quem liberta
      # leases e sela desfechos). Tem de caber no `stop_grace_period` acima — as duas estão
      # declaradas juntas de propósito.
      AOS_SHUTDOWN_BUDGET: "30s"

      # POSTURA. Vazio ⇒ modo de REFERÊNCIA endurecido (o default deste ficheiro).
      # `production` exige, TODAS, sob pena de o boot ABORTAR: AOS_ISSUER_PUBKEY,
      # AOS_BOARD_REGIONS não-vazio, AOS_SOVEREIGN_OIDC_ISSUER+AUDIENCE e terminação
      # TLS declarada. As três primeiras estão abaixo; a soberania forte exige um IdP
      # real — ver README.md §"Passar a AOS_MODE=production".
      AOS_MODE: "${AOS_MODE:-}"

      # Identidade ENDURECIDA trust-anchor-only: só a PUBKEY do issuer externo entra
      # neste processo. Nenhuma chave de assinatura vive no servidor.
      AOS_ISSUER_ID: "${AOS_ISSUER_ID:?}"
      AOS_ISSUER_PUBKEY: "${AOS_ISSUER_PUBKEY:?}"

      # Plano de controlo: operadores (steer/pause), ratificadores (promoção), four-eyes.
      # AOS_OPERATORS vazio ⇒ o bind não-loopback acima é RECUSADO (bind-guardrail).
      AOS_OPERATORS: "${AOS_OPERATORS:?}"
      AOS_RATIFIERS: "${AOS_RATIFIERS:?}"
      AOS_APPROVERS_FILE: "/etc/aos/approvers.json"
      # FRESCURA POR-CERIMÓNIA da aprovação four-eyes (AOS-266). Vazio ⇒ DORMENTE, e o banner
      # de arranque diz o que isso custa: o anti-replay fica só pelo uso-único durável (dedup),
      # pelo que **quem detenha a chave de um aprovador pode reapresentar uma prova capturada
      # num pedido novo**. Com `1`, cada perna exige um challenge EMITIDO pelo servidor e
      # atribuído àquele aprovador — a prova deixa de ser reutilizável fora da cerimónia para
      # que foi pedida. Exige aprovadores compostos (sem eles o endpoint nem existe).
      AOS_CHALLENGE_ISSUANCE: "${AOS_CHALLENGE_ISSUANCE:-}"
      AOS_AUTHORITY_FILE: "/etc/aos/authority.json"

      # PDP: bundle Cedar ASSINADO + trust anchor FORÇADO out-of-band (hex).
      # Sem estas duas o nó fica em default-deny explícito e nenhuma tool call passa.
      AOS_POLICY_BUNDLE_DIR: "/etc/aos/policies"
      AOS_POLICY_TRUST_ANCHOR: "${AOS_POLICY_TRUST_ANCHOR:?}"

      # Substrato + execução DURÁVEIS no volume gravável. É o que faz o estado
      # sobreviver a um deploy (o volume é nomeado e não é tocado pela troca de digest).
      AOS_DURABLE_EXECUTION: "1"
      # AOS-100 — Event Store REPLICADO. Vazio (o default) mantem o WAL local acima;
      # preenchido, PRECEDE-O e o substrato passa a arbitrar entre processos, tornando
      # N replicas do no a configuracao pretendida. NAO usar num board com fronteira
      # regional declarada: o backend ainda nao exprime `placement` (AC5 por fechar).
      AOS_EVENTSTORE_NATS: "${AOS_EVENTSTORE_NATS:-}"
      AOS_EVENTSTORE_NATS_STREAM: "${AOS_EVENTSTORE_NATS_STREAM:-}"
      AOS_EVENTSTORE_NATS_REPLICAS: "${AOS_EVENTSTORE_NATS_REPLICAS:-}"
      # AC5 do AOS-100 — fronteira regional. Vazia deixa a soberania DORMENTE; com
      # AOS_BOARD_REGIONS declarado passa a ser OBRIGATORIA (o no recusa arrancar).
      AOS_EVENTSTORE_NATS_REGION: "${AOS_EVENTSTORE_NATS_REGION:-}"
      AOS_EVENTSTORE_PATH: "/var/lib/aos/events.wal"
      AOS_WORM_PATH: "/var/lib/aos/worm.wal"

      # Soberania de leitura (regra board→região).
      AOS_BOARD_REGIONS: "${AOS_BOARD_REGIONS:?}"

      # --- CREDENCIAL FORTE DA SOBERANIA DE LEITURA (AOS-205) --------------------------------
      # Vazio ⇒ via LEGADA demo-grade: o leitor DECLARA principal+board nos headers
      # X-Aos-Reader/X-Aos-Board e o nó acredita. Fail-closed na mesma (ausência nega), mas
      # quem declara é o cliente. Sob AOS_MODE=production isso é RECUSADO no arranque.
      #
      # Composta ⇒ o board/principal vêm das CLAIMS de um ID-token VERIFICADO contra o IdP; um
      # X-Aos-Board forjado deixa de valer. O nó impõe ainda idade máxima e recusa reutilização
      # de `jti` (anti-replay) — um token capturado não vale duas vezes.
      #
      # ⚠️ HORIZONTE DIVIDIDO, e é deliberado: ISSUER é o que o Keycloak ASSERE no `iss` (o URL
      # público, que o nó NÃO alcança de dentro da rede do compose); JWKS_URI é o caminho que o
      # nó usa mesmo — o nome de rede interno. O certificado do IdP tem SAN para ambos.
      AOS_SOVEREIGN_OIDC_ISSUER: "${AOS_SOVEREIGN_OIDC_ISSUER:-}"
      AOS_SOVEREIGN_OIDC_JWKS_URI: "${AOS_SOVEREIGN_OIDC_JWKS_URI:-}"
      AOS_SOVEREIGN_OIDC_AUDIENCE: "${AOS_SOVEREIGN_OIDC_AUDIENCE:-}"
      # A CA INTERNA assinou os certificados do `idp` e do `vault`. É um BUNDLE (raízes públicas
      # + a nossa), não só a CA: o Go SUBSTITUI o trust store por este ficheiro, e uma CA
      # sozinha deixaria o nó incapaz de verificar qualquer CA pública.
      SSL_CERT_FILE: "${AOS_INTERNAL_CA_BUNDLE:-}"

      # --- SUPERFÍCIE DE CONFIGURAÇÃO QUE ESTAVA INALCANÇÁVEL -------------------------------
      # O bloco `environment` do compose é um ALLOWLIST: uma variável definida no `.env` mas
      # ausente daqui NÃO chega ao contentor. O nó lê 77 variáveis `AOS_*` e este ficheiro
      # passava 41 — as outras 38 eram INDEFINÍVEIS nesta instalação, e não "por definir". Entram
      # aqui 35; três ficam de fora de propósito, e a razão está no fim do bloco.
      #
      # A diferença importa porque a leitura natural do banner de arranque é "isto está
      # desligado, define a variável e liga". Não estava: não havia variável a definir. Oito dos
      # doze conceitos não-provados do inventário estavam bloqueados por aqui.
      #
      # VERIFICADO POR ARRANQUE, e nao so por `docker compose config`: o mesmo binario, as mesmas
      # montagens, um volume de dados NOVO (para nao tocar no WORM em servico) e estas 35 a vazio
      # arranca ate "bootstrap concluido" e fica healthy. Os 47 rotulos de postura do banner sao
      # IDENTICOS aos de producao salvo um — "estado de governacao RE-HIDRATADO" — que falta
      # porque o WORM do teste esta vazio e nao ha nada que repor. Nenhuma postura mudou.
      # Todas entram VAZIAS (`${VAR:-}`), portanto este bloco NÃO muda comportamento nenhum —
      # todos os parsers do nó tratam vazio como ausente (verificado um a um: `strings.TrimSpace`
      # + guarda `!= ""`, ou default explícito). O que muda é passarem a ser definíveis.

      # Autonomia (AOS-087). ATENÇÃO ao ligar: um par (agente, domínio) NÃO registado resolve
      # para L0 ⇒ escalate. Definir isto faz TODO o agente não listado passar a exigir aprovação
      # humana — é fail-closed e correcto, e é uma mudança de comportamento real.
      AOS_AUTONOMY_LEVELS: "${AOS_AUTONOMY_LEVELS:-}"

      # PISO dos pares SEM nível registado. Vazio ⇒ L0 (o mais supervisionado), exactamente
      # como sem esta variável. Existe para o piso ser uma DECLARAÇÃO e não uma herança: hoje
      # um par desconhecido cai em L0 em silêncio, e é isso que faz "ligar a autonomia"
      # significar "todo o agente novo bloqueia". Um valor fora de L0..L5 ABORTA o arranque.
      AOS_AUTONOMY_DEFAULT: "${AOS_AUTONOMY_DEFAULT:-}"

      # Attestation de dispositivo (AOS-177/AOS-266) — sem isto o four-eyes é SÓ estrutural.
      AOS_ATTESTATION_VERIFIER_URL: "${AOS_ATTESTATION_VERIFIER_URL:-}"
      AOS_ATTESTATION_VERIFIER_TOKEN_PATH: "${AOS_ATTESTATION_VERIFIER_TOKEN_PATH:-}"
      AOS_DEVICE_ENROLLMENT_FILE: "${AOS_DEVICE_ENROLLMENT_FILE:-}"

      # Broker de credenciais downstream (AOS-070/AOS-264) — hoje entram por ficheiro montado.
      AOS_BROKER_VAULT_ADDR: "${AOS_BROKER_VAULT_ADDR:-}"
      AOS_BROKER_VAULT_TOKEN_PATH: "${AOS_BROKER_VAULT_TOKEN_PATH:-}"
      AOS_BROKER_VAULT_KV_MOUNT: "${AOS_BROKER_VAULT_KV_MOUNT:-}"
      AOS_BROKER_VAULT_PATH_PREFIX: "${AOS_BROKER_VAULT_PATH_PREFIX:-}"

      # Verificação ancorada do WORM (AOS-268/AOS-072). AS TRÊS em conjunto ou nenhuma —
      # definir algumas ABORTA o arranque (ErrWormAnchorIncomplete) em vez de degradar.
      #
      # A objecção antiga («um checkpoint ancora UMA partição e este WORM tem 108») foi
      # RESOLVIDA a 2026-08-20: o `aos-issuer worm-seal` emite um checkpoint POR PARTIÇÃO e os
      # pisos de frescura à parte (--heads), e o nó recebe-os em conjunto. A forma singular
      # AOS_WORM_EXPECTED_HEAD é recusada em voz alta (ErrWormExpectedHeadObsoleta).
      #
      # O que falta é OPERACIONAL — chave do selador em custódia fora do servidor, selagem
      # contra a cópia do backup, e uma cadência. Ver README §8, ponto 8.
      #
      # LIMITE que a cadência não fecha: as partições nascem por run, logo o run seguinte cria
      # uma que nenhuma selagem anterior cobre. «Ancorado até ao último selo; depois disso, só
      # re-encadeamento.» Selar mais vezes encolhe a janela; não a fecha.
      # AS TRES CONTINUAM A VIR DO .env DO SERVIDOR, e nao fixadas aqui. Se eu fixasse os dois
      # caminhos e deixasse a pública por preencher, ficariam «algumas das três» — e isso ABORTA
      # o arranque (ErrWormAnchorIncomplete). Vindo as três do mesmo sítio, ligam-se de uma vez.
      #
      # OS CAMINHOS A USAR, dado o que o bloco `volumes:` monta:
      #   AOS_WORM_TRUST_ANCHOR=<saida de `aos-issuer pubkey --key-file wormseal.key`>
      #   AOS_WORM_CHECKPOINT_FILE=/etc/aos/ancoras/checkpoints.json
      #   AOS_WORM_EXPECTED_HEADS_FILE=/etc/aos/pisos/heads.json
      #
      # E LIGAR ISTO É IRREVERSÍVEL SEM UM DEPLOY: a verificação é fail-closed POR PARTIÇÃO, e uma
      # âncora que não bata com o WORM impede o nó de servir. Ligue depois de a selagem diária já
      # estar a entregar os ficheiros, nunca antes.
      AOS_WORM_TRUST_ANCHOR: "${AOS_WORM_TRUST_ANCHOR:-}"
      AOS_WORM_CHECKPOINT_FILE: "${AOS_WORM_CHECKPOINT_FILE:-}"
      AOS_WORM_EXPECTED_HEADS_FILE: "${AOS_WORM_EXPECTED_HEADS_FILE:-}"

      # Autenticação do cliente OTLP (DEF-012) — hoje só TLS de servidor.
      AOS_OTLP_BEARER_TOKEN_PATH: "${AOS_OTLP_BEARER_TOKEN_PATH:-}"
      AOS_OTLP_CLIENT_CERT_PATH: "${AOS_OTLP_CLIENT_CERT_PATH:-}"
      AOS_OTLP_CLIENT_KEY_PATH: "${AOS_OTLP_CLIENT_KEY_PATH:-}"

      # Tabela de preços do modelo (AOS-259) — sem ela o custo é ZERO POR AUSÊNCIA DE DADOS,
      # que não é custo nulo, e um tecto em dólares compararia sempre contra zero.
      AOS_MODEL_PRICING_PATH: "${AOS_MODEL_PRICING_PATH:-}"

      # Allowlist de modelos assinada (EPIC-06).
      AOS_MODEL_ALLOWLIST_BUNDLE_DIR: "${AOS_MODEL_ALLOWLIST_BUNDLE_DIR:-}"
      AOS_MODEL_ALLOWLIST_TRUST_ANCHOR: "${AOS_MODEL_ALLOWLIST_TRUST_ANCHOR:-}"

      # Directório humano OIDC (AOS-174) — só tem efeito no modo de REFERÊNCIA; no endurecido
      # o directório humano vive com o issuer externo. Aqui por completude da superfície.
      AOS_HUMAN_OIDC_ISSUER: "${AOS_HUMAN_OIDC_ISSUER:-}"
      AOS_HUMAN_OIDC_AUDIENCE: "${AOS_HUMAN_OIDC_AUDIENCE:-}"
      AOS_HUMAN_OIDC_JWKS_URI: "${AOS_HUMAN_OIDC_JWKS_URI:-}"

      # Endurecimento do read-path soberano: tecto de idade e exigência de jti.
      AOS_SOVEREIGN_OIDC_MAX_AGE: "${AOS_SOVEREIGN_OIDC_MAX_AGE:-}"
      AOS_SOVEREIGN_OIDC_REQUIRE_JTI: "${AOS_SOVEREIGN_OIDC_REQUIRE_JTI:-}"

      # TLS NO PRÓPRIO NÓ — alternativa a AOS_TLS_EXTERNAL_TERMINATION. A chave privada entra
      # por FICHEIRO MONTADO, nunca por variável de ambiente (é o caminho, não o material).
      AOS_TLS_CERT_PATH: "${AOS_TLS_CERT_PATH:-}"
      AOS_TLS_KEY_PATH: "${AOS_TLS_KEY_PATH:-}"
      AOS_CONTROL_MTLS_CA_PATH: "${AOS_CONTROL_MTLS_CA_PATH:-}"

      # Custódia DSAR/Vault: mount do Transit e piso de TTL do token.
      AOS_DSAR_VAULT_TRANSIT_MOUNT: "${AOS_DSAR_VAULT_TRANSIT_MOUNT:-}"
      AOS_DSAR_VAULT_TOKEN_MIN_TTL: "${AOS_DSAR_VAULT_TOKEN_MIN_TTL:-}"

      # Cadências e limites do loop de serviço.
      AOS_CRASH_RESUME_INTERVAL: "${AOS_CRASH_RESUME_INTERVAL:-}"
      AOS_APPROVAL_SWEEP_INTERVAL: "${AOS_APPROVAL_SWEEP_INTERVAL:-}"
      AOS_CHALLENGE_TTL: "${AOS_CHALLENGE_TTL:-}"
      AOS_MAX_TURNS: "${AOS_MAX_TURNS:-}"
      AOS_PROGRESS_THRESHOLD: "${AOS_PROGRESS_THRESHOLD:-}"
      AOS_SLO_WINDOW: "${AOS_SLO_WINDOW:-}"
      AOS_SLO_EVAL_INTERVAL: "${AOS_SLO_EVAL_INTERVAL:-}"
      AOS_SANDBOX_SEED_DIR: "${AOS_SANDBOX_SEED_DIR:-}"

      # --- TRÊS QUE FICAM DE FORA, E PORQUÊ --------------------------------------------------
      #
      # AOS_ISSUER_KEY_PATH — daria ao nó um caminho para uma CHAVE DE ASSINATURA. O modo de
      #   identidade deste nó é trust-anchor-only (AOS-156): "nenhuma chave de assinatura entra
      #   no runtime do nó", e é isso que faz com que código comprometido in-process não tenha
      #   material com que cunhar. Tornar isto definível é oferecer a porta que a postura fecha.
      #
      # AOS_READER / AOS_BOARD — a credencial de leitor DEMO-GRADE por variável de ambiente.
      #   Sob AOS_MODE=production não autoriza nada (o board vem das claims), mas passá-las
      #   convidaria a tentar, e o sintoma seria uma recusa opaca. A ausência é a documentação.

      # --- CUSTÓDIA DURÁVEL DA KEK (AOS-215/AOS-216) ----------------------------------------
      # Com substrato durável (acima), a KEK por-titular NÃO pode viver em memória: um restart
      # tornaria o conteúdo cifrado dos runs PERMANENTEMENTE indecifrável — apagamento
      # silencioso, e o legal hold deixaria de preservar o que promete. Sob
      # AOS_MODE=production o nó recusa arrancar sem isto.
      # O transporte tem de ser https (http só em loopback) e o token vem por FICHEIRO montado,
      # nunca por variável — material privado não entra no ambiente do processo.
      AOS_DSAR_VAULT_ADDR: "${AOS_DSAR_VAULT_ADDR:-}"
      AOS_DSAR_VAULT_TOKEN_PATH: "${AOS_DSAR_VAULT_TOKEN_PATH:-}"

      # Retenção TTL-por-classe + varredor INTERNO (sem cron externo).
      AOS_RETENTION_VERSION: "${AOS_RETENTION_VERSION:-1.0.0}"
      AOS_RETENTION_PERIODS: "${AOS_RETENTION_PERIODS:-pii_operational=720h,trajectory=2160h,diagnostic=168h}"
      AOS_RETENTION_SWEEP_INTERVAL: "${AOS_RETENTION_SWEEP_INTERVAL:-1h}"

      # Admissão de ingresso (backpressure, NÃO autorização).
      AOS_INGRESS_RATE: "${AOS_INGRESS_RATE:-64}"
      AOS_INGRESS_BURST: "${AOS_INGRESS_BURST:-128}"
      AOS_INGRESS_MAX_INFLIGHT: "${AOS_INGRESS_MAX_INFLIGHT:-512}"

      # Tecto de ORÇAMENTO por-run, em tokens (AOS-008/AOS-256/AOS-260). Vazio ⇒ o ponto de
      # injecção `budget` fica o stub neutro e a porta de admissão do turno de modelo NÃO é
      # ligada. Definido ⇒ cada tool call reserva headroom antes de executar (sem headroom é
      # NEGADA, selada no WORM) e a inferência reserva antes e salda pelo consumo MEDIDO.
      # Esgotar NÃO é deny-loop: com o four-eyes composto o run SUSPENDE em `waiting_on_human`
      # e fica retomável; sem ele sela `timed_out`/`budget_exhausted` — nunca `failed`.
      AOS_BUDGET_MAX_TOKENS: "${AOS_BUDGET_MAX_TOKENS:-}"
      # Tecto em DÓLARES (micro-USD), opcional. Vazio ⇒ dólares são medidos e debitados mas
      # NUNCA negam; a decisão fica só na dimensão tokens.
      AOS_BUDGET_MAX_COST_MICRO_USD: "${AOS_BUDGET_MAX_COST_MICRO_USD:-}"

      # TLS terminado A MONTANTE pelo `edge`. O nó serve em claro SÓ na rede interna
      # do compose (`expose`, nunca `ports`) — é o que honra esta declaração.
      AOS_TLS_EXTERNAL_TERMINATION: "1"

      AOS_OTLP_ENDPOINT: "http://otel:4318"

      # --- MODEL GATEWAY (EPIC-06) ---------------------------------------------------------
      # VAZIO ⇒ modelo de REFERÊNCIA: cada turno devolve texto fixo, sem tool calls, e o
      # RM/PDP nunca chega a mediar nada. É o estado por omissão, e é honesto: um nó que
      # declara não ter modelo vale mais do que um que falha cada run com erro de provider.
      #
      # ⚠️ ENDPOINT e NAME são AMBOS obrigatórios — definir só um ABORTA o arranque
      # (`ErrBadModelConfig`). Por isso o default vazio de ambos é seguro.
      #
      # AOS_MODEL_NAME tem de constar da allowlist ASSINADA embebida: para `board-eu` em
      # `eu`/`eu-west` são `gpt-4o`, `gpt-4o-mini` e `text-embedding-3-large`. Fora disso é
      # negado NO NÓ, antes de sair uma única chamada.
      AOS_MODEL_ENDPOINT: "${AOS_MODEL_ENDPOINT:-}"
      AOS_MODEL_NAME: "${AOS_MODEL_NAME:-}"
      AOS_MODEL_REGION: "${AOS_MODEL_REGION:-eu}"
      AOS_MODEL_BOARD: "${AOS_MODEL_BOARD:-board-eu}"
      # Bearer para o LiteLLM, por FICHEIRO montado (nunca por variável). Só necessário se o
      # LiteLLM tiver LITELLM_MASTER_KEY definida.
      AOS_MODEL_API_KEY_PATH: "${AOS_MODEL_API_KEY_PATH:-}"
      # WORM DEDICADO da governação do gateway: activação da allowlist regional e cada decisão
      # allow/deny por chamada, incluindo o deny de failover cross-border. Vazio ⇒ in-memory,
      # e essa governação NÃO sobrevive a um restart.
      AOS_MODEL_AUDIT_PATH: "${AOS_MODEL_AUDIT_PATH:-/var/lib/aos/model-audit.wal}"
      # REGISTRY DE TOOLS oferecidas ao modelo. Sem ele o modelo não emite `tool_calls` e o
      # Reference Monitor não tem o que mediar. Com ele, cada call é mediada no ponto único:
      # o binding de governança vem DAQUI (config trusted), o modelo só escolhe o NOME, e o
      # taint fica `untrusted` — pelo que uma capability privilegiada pedida pelo modelo é
      # NEGADA pelo taint-gate ("untrusted não comanda").
      AOS_MODEL_TOOLS: "${AOS_MODEL_TOOLS:-}"
      AOS_MODEL_TOOLS_REGISTER: "${AOS_MODEL_TOOLS_REGISTER:-}"

      # --- SANDBOX (AOS-005/AOS-064) --------------------------------------------------------
      # `fake` é o DEFAULT e é um jail in-process REAL (overlay read-only, seccomp default-deny,
      # escape bloqueado) — mas o próprio pacote marca-o "NUNCA usar em produção", e com razão:
      # a fronteira é o processo do nó, não o kernel.
      #
      # `firecracker` exige /dev/kvm. Num host que seja ele próprio um convidado sem
      # virtualização aninhada esse caminho está FECHADO — e é o caso deste servidor.
      #
      # `gvisor` interpõe syscalls em user-space (systrap) e NÃO precisa de KVM. Exige a URL
      # abaixo: sem ela o driver fica o skeleton e o exec devolve ErrDriverUnavailable — o gap
      # honesto, nunca uma execução fora do sandbox.
      AOS_SANDBOX_DRIVER: "${AOS_SANDBOX_DRIVER:-}"
      AOS_SANDBOX_GVISOR_URL: "${AOS_SANDBOX_GVISOR_URL:-}"
      AOS_SANDBOX_FIRECRACKER_URL: "${AOS_SANDBOX_FIRECRACKER_URL:-}"
    volumes:
      - aos-data:/var/lib/aos                            # estado durável (gravável)
      - ./secrets/approvers.json:/etc/aos/approvers.json:ro
      - ./secrets/authority.json:/etc/aos/authority.json:ro
      - ./policies:/etc/aos/policies:ro                  # bundle PDP assinado (sincronizado pelo deploy)
      - ./model-tools/tools.json:/etc/aos/model-tools.json:ro
      # ÂNCORA DO WORM (AOS-268/AOS-072). DOIS bind-mounts SEPARADOS, e a separação é o mecanismo,
      # não arrumação: o piso de frescura existe para recusar um checkpoint LEGÍTIMO mas ANTERIOR,
      # reapresentado para mascarar a truncatura do que veio depois. Quem substituir SÓ um dos
      # ficheiros é apanhado (`ErrCheckpointStale`); se viajassem juntos, trocar um trocaria os
      # dois e o piso deixava de morder no ataque que existe para fechar.
      #
      # O CONTEÚDO NÃO VEM DO DEPLOY, e isso é deliberado por duas razões:
      #  1. o `checkpoints.json` nomeia as partições, que incluem `gov.read/<run-id>` — commitá-lo
      #     publicaria no git o que o 404 uniforme existe para não deixar enumerar;
      #  2. a cadência de selagem é DIÁRIA e os deploys não são. Uma âncora que viajasse com o
      #     deploy só se renovaria quando houvesse deploy, o que anularia a cadência.
      #
      # O deploy MONTA e LIGA (uma vez); a selagem diária ENTREGA o conteúdo por scp. Ver
      # README §8 e `selar-worm.ps1`.
      #
      # `:ro` porque o nó CONSOME a âncora e nunca a produz (molde AOS-156).
      # MONTAM-SE OS DIRECTORIOS, nao os ficheiros, e por duas razoes concretas:
      #  · um bind-mount de FICHEIRO inexistente faz o Docker criar um DIRECTORIO com esse nome no
      #    host — e o `scp` da selagem diaria deixaria de conseguir escrever por cima;
      #  · um bind-mount de ficheiro prende o INODE (ja documentado neste ficheiro para o LiteLLM):
      #    a entrega seguinte escreveria um inode novo que o contentor nunca veria.
      - ./ancoras:/etc/aos/ancoras:ro
      - ./pisos:/etc/aos/pisos:ro
      # CA interna (bundle) + material privado por FICHEIRO. Os três são montados sempre; o que
      # decide se são USADOS são as envs acima. Montar um ficheiro que o nó ignora é inócuo —
      # já um `volumes:` condicional não existe em compose, e um bind em falta impede o arranque.
      - ./tls-internal/ca-bundle.crt:/etc/aos/internal-ca.crt:ro
      - ./secrets/vault-token:/etc/aos/vault-token:ro
      - ./secrets/model-api.key:/etc/aos/model-api.key:ro
    expose:
      - "8080"
    depends_on:
      otel:
        condition: service_started

  # --- edge de ingresso: termina TLS e é a ÚNICA porta publicada no host ----------------------
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/tls:/etc/nginx/tls:ro
    # A porta INTERNA é sempre 8443 (é o que o nginx.conf escuta); a EXTERNA vem do .env,
    # porque 8443 no host já pertence ao ingress-nginx do Kubernetes.
    ports:
      - "${AOS_EDGE_BIND:-0.0.0.0}:${AOS_EDGE_PORT:-8444}:8443"
    depends_on:
      aos:
        condition: service_healthy   # espera o HEALTHCHECK do nó antes de aceitar tráfego.

  # --- gVisor: executor de sandbox REAL (interposição de syscalls, sem KVM) --------------------
  # Componente SEPARADO do nó de propósito: é ele que corre privilegiado — o runsc precisa de
  # criar namespaces e montar bundles — e o nó nunca corre. A fronteira entre os dois é HTTP,
  # exactamente como no componente Firecracker.
  #
  # ⚠️ `privileged: true` neste host partilhado é a concessão desta escolha, e deve ser lida
  # como tal: troca-se privilégio no componente por isolamento ao nível do kernel para as tool
  # calls. Sem ele, o runsc não arranca dentro de um contentor.
  gvisor:
    build:
      context: ../..
      dockerfile: deploy/server/gvisor/Dockerfile
    image: aos-gvisor:local
    restart: unless-stopped
    privileged: true
    mem_limit: ${GVISOR_MEM_LIMIT:-1g}
    pids_limit: 512
    environment:
      GV_ADDR: ":9101"
      GV_SEED_DIR: "/seed"
      GV_PLATFORM: "${GV_PLATFORM:-systrap}"
    volumes:
      # Raiz semeada READ-ONLY: o único conteúdo que uma tool `read` alcança.
      - ./gvisor/seed:/seed:ro
    expose:
      - "9101"

  # --- LiteLLM: gateway de modelos externo e config-driven ------------------------------------
  # Trocar de provider ou de modelo faz-se em litellm/config.yaml + secrets/model.env, SEM tocar
  # no nó. Nunca publica porta no host: só é alcançável na rede interna do compose, o que é o
  # que torna aceitável falar sem master key.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    # 2g e não 1g: com 1 GiB o processo é morto pelo OOM killer do cgroup DURANTE o arranque
    # (medido: anon-rss 1 036 MB contra o tecto de 1 024). O contentor reaparece como `Up` e
    # `OOMKilled` fica `false` — quem morreu foi o processo lá dentro, não o contentor — e os
    # logs ficam VAZIOS, o que torna o diagnóstico enganador. A pista real está no `dmesg`.
    mem_limit: ${LITELLM_MEM_LIMIT:-2g}
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    env_file:
      # `required: false` — o ficheiro das chaves é criado pelo operador e não está no git.
      # Sem ele o LiteLLM arranca na mesma; simplesmente não tem provider configurado.
      - path: ./secrets/model.env
        required: false
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    expose:
      - "4000"

  # --- collector OTLP: recebe traces do nó e faz scrape de /metrics --------------------------
  otel:
    image: otel/opentelemetry-collector-contrib:0.115.1
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 512
    cpus: 0.5
    # 9464 é o endpoint agregado de MÉTRICAS que o exportador `prometheus` serve. `expose` e NÃO
    # `ports`: fica alcançável de dentro da rede do compose e invisível do host, a mesma postura
    # do :8080 do nó. Publicá-lo daria um `/metrics` não-autenticado na Internet.
    #
    # Antes de 2026-08-21 o pipeline de métricas exportava para `debug`, cuja saída é de nível
    # INFO enquanto `telemetry.logs.level` está em `warn`: as séries eram raspadas de 15 em 15
    # segundos e DEITADAS FORA. Ver a nota no `otel-collector.yaml`.
    expose:
      - "9464"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  # ============================================================================================
  # SOBERANIA E CUSTÓDIA — os dois serviços que AOS_MODE=production exige
  # ============================================================================================
  # ⚠️ LIMITES DE CPU. Este host corre um control-plane Kubernetes e foi medido com load average
  # ~17 em 8 vCPU — já a mais do dobro. Os serviços abaixo têm `cpus:` DECLARADO por isso: sem
  # tecto, o arranque da JVM do Keycloak compete de igual para igual com o kube-apiserver e
  # degrada o nó que estamos a tentar endurecer. Os serviços mais antigos deste ficheiro não têm
  # (dívida conhecida, ver README §"O que esta configuração ainda não fecha").

  # --- base de dados do IdP -------------------------------------------------------------------
  # Keycloak com storage em memória (modo `dev`) perderia utilizadores e sessões a cada restart —
  # e com eles a capacidade de LER runs. Postgres é o que torna a identidade durável.
  idp-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: "keycloak"
      POSTGRES_USER: "keycloak"
      POSTGRES_PASSWORD: "${IDP_DB_PASSWORD:?IDP_DB_PASSWORD por definir — gerada por provision-identity.sh}"
    volumes:
      - idp-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- Keycloak: a autoridade sobre QUEM lê ---------------------------------------------------
  # `start` (não `start-dev`): modo produção do próprio Keycloak — https obrigatório, hostname
  # fixo. KC_HOSTNAME fixa o `iss` que os tokens levam; é o URL PÚBLICO, porque é o que o cliente
  # vê. O nó não o usa para alcançar o IdP (ver AOS_SOVEREIGN_OIDC_JWKS_URI).
  idp:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    mem_limit: 1200m
    pids_limit: 512
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${IDP_ADMIN_USER:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${IDP_ADMIN_PASSWORD:?IDP_ADMIN_PASSWORD por definir — gerada por provision-identity.sh}"
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://idp-db:5432/keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "${IDP_DB_PASSWORD:?}"
      KC_HOSTNAME: "${IDP_PUBLIC_URL:?IDP_PUBLIC_URL por definir — ex. https://aos.elysiumii.site:9443}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "false"                # só https — o nó exige transporte cifrado ao IdP
      KC_HTTPS_CERTIFICATE_FILE: "/etc/keycloak/tls/idp.crt"
      KC_HTTPS_CERTIFICATE_KEY_FILE: "/etc/keycloak/tls/idp.key"
      KC_HEALTH_ENABLED: "true"
      # KC_PROXY_HEADERS fica DELIBERADAMENTE por definir: o IdP publica a sua própria porta e
      # não tem proxy à frente, pelo que confiar em X-Forwarded-* seria aceitar cabeçalhos que
      # ninguém sanitiza. (Defini-la a "" não a desliga — o Keycloak recusa o valor vazio e
      # entra em ciclo de reinício.)
    volumes:
      - ./keycloak/realm-aos.json:/opt/keycloak/data/import/realm-aos.json:ro
      - ./tls-internal/idp:/etc/keycloak/tls:ro
    ports:
      # O OPERADOR tem de alcançar o IdP para obter um ID-token; sem isso ninguém lê runs. 8444
      # pertence ao edge e 8443 ao ingress-nginx do Kubernetes, daí 9443.
      - "${IDP_BIND:-0.0.0.0}:${IDP_PORT:-9443}:8443"
    depends_on:
      idp-db:
        condition: service_healthy
    healthcheck:
      # LIVENESS, não readiness — e a diferença está declarada de propósito. O /health/ready do
      # Keycloak 26 vive na porta de management 9000, que quando o servidor tem HTTPS configurado
      # fala TLS; e esta imagem não traz curl, wget nem openssl, pelo que não há dentro do
      # contentor nada que saiba falar TLS. Um healthcheck que não se consegue satisfazer marca o
      # serviço unhealthy para sempre e nunca deixa um `depends_on: service_healthy` completar —
      # foi o que aconteceu na primeira tentativa. Isto prova que o listener aceita ligações, e
      # não que o realm está servível. Quem impõe a postura real é o nó: sem IdP alcançável, o
      # read-path NEGA fail-closed em vez de degradar em silêncio.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  # --- Vault: custódia da KEK por-titular (motor Transit) -------------------------------------
  # Storage `file`, NÃO `-dev`: as KEKs SOBREVIVEM a restart. É a razão de existir — com a KEK em
  # memória, um restart tornaria o conteúdo cifrado dos runs indecifrável para sempre.
  # ⚠️ O custo é real: com storage file o Vault sobe SELADO. Ver secrets/vault-unseal.sh e o
  # README §"O selo do Vault" — a escolha de disponibilidade está lá declarada, não escondida.
  vault:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    cpus: 0.5
    cap_add:
      - IPC_LOCK                    # mlock: impede que o material de chave vá para swap
    environment:
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.crt"
    command: ["server"]
    volumes:
      - vault-data:/vault/file
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - ./tls-internal/vault:/vault/tls:ro
    expose:
      - "8200"
    healthcheck:
      # 501 = inicializado mas SELADO; 200 = destravado. Ambos provam que o processo responde —
      # `vault status` devolve exit != 0 quando selado, o que marcaria o serviço unhealthy para
      # sempre e impediria o `depends_on` do nó de alguma vez ser satisfeito.
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O- https://127.0.0.1:8200/v1/sys/health?sealedcode=501 >/dev/null 2>&1 || [ $$? -eq 8 ]"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- watchdog de unseal -------------------------------------------------------------------
  # Com storage `file` o Vault sobe SELADO, e um Vault selado é um nó que não decifra o conteúdo
  # dos runs. Isto destrava-o — ao arranque da stack, depois de um reboot do host, e sempre que
  # ele voltar a selar. É um serviço do compose e não uma unidade systemd de propósito: não
  # exige root para instalar e cobre mais casos do que um `After=docker.service`.
  # O trade-off de segurança está declarado em vault/unseal-watchdog.sh — leia-o antes de
  # assumir que o selo protege mais do que protege.
  vault-unseal:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    mem_limit: 64m
    pids_limit: 32
    cpus: 0.1
    security_opt:
      - no-new-privileges:true
    environment:
      VAULT_ADDR: "https://vault:8200"
    entrypoint: ["/bin/sh", "/unseal-watchdog.sh"]
    volumes:
      - ./vault/unseal-watchdog.sh:/unseal-watchdog.sh:ro
      - ./secrets/vault-init.json:/vault/init/vault-init.json:ro
    depends_on:
      vault:
        condition: service_started

volumes:
  aos-data:
  idp-db:
  vault-data:
