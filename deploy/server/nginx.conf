# Edge de INGRESSO do servidor — termina TLS a MONTANTE do nó `aos` (topologia AOS-209).
#
# O nó serve API/SSE/DSAR em claro APENAS na rede interna do compose (`expose`, nunca `ports`)
# e declara AOS_TLS_EXTERNAL_TERMINATION=1. A "responsabilidade assumida" que o banner do nó
# imprime é honrada exactamente aqui: é este processo que cifra o transporte até ao cliente.
#
# Porquê o edge e não TLS no próprio nó: o HEALTHCHECK do nó é um probe HTTP no loopback do
# contentor (deploy/node/healthprobe) e não fala TLS — TLS no nó deixaria o container unhealthy
# e o `depends_on: service_healthy` deste stack nunca abriria o edge.
worker_processes auto;
events { worker_connections 1024; }

http {
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  server_tokens off;
  client_max_body_size 8m;

  # ------------------------------------------------------------------------------------
  # LIMITE POR ORIGEM — a camada que faltava sob o balde de admissão do nó.
  #
  # O nó tem admissão (AOS-166/277: 64 pedidos/s, burst 128), mas o balde é GLOBAL: não tem
  # chave por chamador. E a admissão actua ANTES da autenticação, de propósito — rejeitar
  # barato protege a maquinaria de cripto de carga.
  #
  # A consequência estava medida e declarada no inventário: 500 pedidos SEM credencial
  # produziram 442 `403` + 58 `429`. Um chamador anónimo consome o orçamento de admissão de
  # TODOS, e o operador legítimo que chegue a seguir leva 429 por causa dele.
  #
  # O nó não pode resolver isto sozinho sem passar a manter estado por origem — e o sítio
  # certo para o estado por origem é aqui, à frente. O nó NÃO publica porta nenhuma para o
  # host (só o edge publica a 8444), pelo que esta camada é incontornável de fora.
  #
  # OS NÚMEROS: 16r/s por IP com burst 32, contra 64/s + burst 128 globais do nó. Uma origem
  # sozinha deixa de poder esgotar o orçamento de todas; quatro em simultâneo ainda podem, e
  # é isso que um limite por-origem consegue — NÃO fecha um flood distribuído.
  #
  # 429 e não o 503 por omissão do nginx: é o mesmo código que o nó devolve para o mesmo
  # significado, e quem o receba não tem de saber qual das camadas o recusou para o entender.
  limit_req_zone $binary_remote_addr zone=por_origem:10m rate=16r/s;
  limit_req_status 429;

  # Resolver DNS do Docker: resolve o nome do serviço `aos` em RUNTIME, para que o nginx
  # arranque mesmo que o nó ainda esteja a subir.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Rejeita conexões sem SNI/host conhecido antes de chegarem ao nó.
  server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/edge.crt;
    ssl_certificate_key /etc/nginx/tls/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;

    location / {
      # O limite por origem aplica-se ANTES do proxy: um flood de uma origem para aqui e nao
      # chega ao balde global do no.
      limit_req zone=por_origem burst=32 nodelay;

      # Variável ⇒ o proxy_pass resolve o upstream por pedido via `resolver` (não trava o
      # arranque do nginx se o nó ainda não existir no DNS interno).
      set $upstream http://aos:8080;
      proxy_pass $upstream;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # SSE (GET /trajectory, streams de observação): sem buffering, ligação longa.
      proxy_buffering off;
      proxy_cache     off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # /metrics NÃO é exposto ao mundo: o scrape faz-se na rede interna pelo collector.
    # Um deployment com Prometheus externo abre-o aqui COM autenticação, nunca assim.
    location = /metrics { return 404; }
  }
}
