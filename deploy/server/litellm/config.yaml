# =============================================================================
# LiteLLM — gateway de modelos EXTERNO e config-driven, para o nó `aos` de produção.
#
# ─── A divisão que interessa perceber ────────────────────────────────────────────────────────
# `model_name`  é o ALIAS que o NÓ pede. TEM de constar da allowlist ASSINADA e EMBEBIDA do
#               gateway do nó — para `board-eu` nas regiões `eu`/`eu-west` são exactamente:
#               `gpt-4o`, `gpt-4o-mini` (chat) e `text-embedding-3-large` (embeddings).
#               A política é `default: deny`; um nome fora dela é NEGADO no nó, antes de
#               qualquer chamada sair. É a fronteira de GOVERNANÇA, imutável sem re-assinar.
#
# `litellm_params.model` é o provider/modelo REAL, e `api_base` o endpoint. Trocar de provider,
#               de modelo ou de região faz-se AQUI, sem tocar no nó nem no código — e SEM
#               ASSINATURA: este ficheiro não é assinado.
#
# Ou seja: o nó governa QUE nomes podem ser pedidos; este ficheiro decide o que eles significam.
#
# ─── O que fica governado, e o que não fica (AOS-505) ────────────────────────────────────────
# Com `AOS_MODEL_ROUTE_GOVERNANCE=observe|enforce` no nó, o que este ficheiro decide deixa de ser
# invisível: em cada turno o nó compara o `litellm_params.model` que o LiteLLM DECLARA ter servido
# (cabeçalho `x-litellm-model-name`) com o modelo esperado do perfil da rota, que vive no código
# do nó; e, com `AOS_MODEL_ROUTE_API_HOST` definida, o host do `api_base`. Uma troca feita aqui
# fica registada em cada turno (`observe`) ou faz o turno falhar (`enforce`). Consequência
# prática: MUDAR `model` OU `api_base` NUM NÓ EM `enforce` PÁRA OS RUNS até o perfil (código) e a
# variável do host acompanharem a mudança.
#
# O que NÃO fica governado: o que o provider serve de facto por trás desse nome e desse endpoint
# (o nó lê o que o LiteLLM declara, não o que o provider fez); este ficheiro continua sem
# assinatura; e com a governação em `off` — a omissão — nada disto é comparado.
#
# NÃO ponhas `model_info.id` nas entradas: fixa o identificador do deployment e não serve de nada
# ao nó, que não o lê (é derivado da chave do provider).
#
# As chaves dos providers vivem em `../secrets/model.env` (git-ignored) e NUNCA aqui.
# =============================================================================

model_list:
  # ⚠️ POR CONFIGURAR — descomenta o bloco do teu provider e põe a chave em secrets/model.env.
  #
  # Enquanto nenhum estiver activo, o LiteLLM arranca mas não serve modelo nenhum, e o nó
  # continua no modelo de REFERÊNCIA (texto fixo). É deliberado: melhor um nó que declara não
  # ter modelo do que um que falha cada run com um erro de provider.

  # --- OpenAI -------------------------------------------------------------------------------
  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY

  # --- Anthropic (o alias continua a ser um nome allowlisted; o modelo real é livre) ---------
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: anthropic/claude-sonnet-4-5
  #     api_key: os.environ/ANTHROPIC_API_KEY

  # --- Provider OpenAI-compatível genérico (Kimi, Groq, Together, vLLM local…) ---------------
  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/kimi-for-coding
  #     api_key: os.environ/MOONSHOT_API_KEY
  #     api_base: https://api.kimi.com/coding/v1

litellm_settings:
  # `false` (AOS-505): um parâmetro que o provider não suporte passa a ser um ERRO visível, em
  # vez de ser descartado em silêncio. Hoje o nó não envia nenhum parâmetro opcional (só `model`,
  # `messages` e `tools` — preso por teste), pelo que isto não altera nenhum pedido; importa no
  # dia em que enviar `tool_choice`, amostragem ou `max_tokens`. MEDIDO com a 1.96.2: para um
  # `openai/<nome>` com `api_base` próprio o LiteLLM reencaminha tudo com `true` ou com `false` —
  # quem aceita ou recusa o parâmetro é o provider. Rollback: voltar a `true` e recriar o serviço.
  #
  # ESTE FICHEIRO É A SEMENTE: o deploy nunca reescreve o config.yaml que já está no servidor.
  # Pôr `false` em produção é um passo do dono (README, «Rota do modelo sob governação»).
  drop_params: false
  telemetry: false       # sem telemetria externa

general_settings:
  background_health_checks: false
  # Com `LITELLM_MASTER_KEY` definida em secrets/model.env, o nó tem de a apresentar como
  # bearer — e aí define-se `AOS_MODEL_API_KEY_PATH` no nó, apontando a um ficheiro montado.
  # Sem ela, o nó fala com o LiteLLM sem autenticação: aceitável APENAS porque o LiteLLM não
  # publica porta nenhuma no host e só é alcançável na rede interna do compose.
