# Collector do servidor — recebe os TRACES que o nó exporta (AOS_OTLP_ENDPOINT) e faz SCRAPE
# das MÉTRICAS do nó (GET /metrics na rede interna).
#
# Os dois pipelines saem para o stdout do contentor, que o docker rota para o journald do host
# (ver o daemon.json escrito por bootstrap.sh). É deliberadamente o mínimo verificável: um
# backend real (tempo/jaeger para traces, prometheus remote-write/mimir para métricas) entra
# como um exporter adicional aqui, sem tocar no nó.
#
# Alertas de SLO a ligar quando houver backend: aos_ready, aos_eventstore_healthy,
# aos_dsar_vault_ready (este último só conta com AOS_DSAR_VAULT_ADDR configurado).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
  prometheus:
    config:
      scrape_configs:
        - job_name: aos-node
          scrape_interval: 15s
          static_configs:
            - targets: ["aos:8080"]

processors:
  batch: {}
  # Tecto de memória: um pico de traces não pode derrubar o collector e, com ele, a
  # observabilidade do nó no momento em que ela é mais precisa.
  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 15

exporters:
  # debug — o destino das TRACES, e fica declarado o que isso significa: os spans são recebidos e
  # DESCARTADOS. O `aos_otlp_spans_exported_total` conta os spans que o colector ACEITOU, não os
  # que alguém guardou. Ligar um backend real de traces (tempo/jaeger) é uma decisão de infra por
  # tomar, e continua nomeada em vez de escondida.
  debug:
    verbosity: normal

  # prometheus — o destino das MÉTRICAS.
  #
  # O DEFEITO QUE ISTO FECHA, encontrado a 2026-08-21 a perguntar «alguém lê estas séries?»: o
  # pipeline de métricas exportava para `debug`, cuja saída é de nível INFO — e
  # `service.telemetry.logs.level` está em `warn`. As séries eram raspadas de 15 em 15 segundos,
  # empacotadas, e DEITADAS FORA em silêncio. Tudo o que este repositório descreve como
  # «alertável» — idade da âncora do WORM, folga do orçamento, saúde do varredor de retenção,
  # falhas de export OTLP — caía num buraco negro.
  #
  # Com este exportador, o colector passa a MANTER o último valor de cada série e a servi-la num
  # endpoint estável. Não publica porta no host: só é alcançável de dentro da rede do compose,
  # a mesma postura do :8080 do nó.
  #
  # O QUE ISTO NÃO DÁ, e é metade da verdade: não há retenção histórica nem regras de alerta.
  # Isto torna as séries LEGÍVEIS e RASPÁVEIS; alertar sobre elas exige um Prometheus (ou
  # equivalente) apontado aqui, que é uma decisão de infra por tomar.
  #
  # AS REGRAS RECOMENDADAS EXISTEM, ESCRITAS, PARA QUEM TOMAR ESSA DECISÃO (AOS-327). Não
  # ficam aqui como ficheiro de regras porque nada as carregaria — um artefacto inerte que
  # parece protecção é pior do que a sua ausência declarada. Vivem no runbook do modo de
  # falha que cobrem, que é onde quem monta o alerta vai ler o que fazer quando ele
  # disparar: `docs/runbooks/RB-06.md` §«Regra de alerta recomendada» (crypto-shred por
  # confirmar — apagamento do Art. 17 não satisfeito).
  #
  # UMA ARMADILHA NOMEADA, porque é fácil cair nela: NÃO escrever regras `absent()` sobre
  # as séries do DSAR. `aos_dsar_vault_shred_unconfirmed` e `aos_dsar_vault_ready` só são
  # emitidas por uma custódia de KEK que saiba responder (o Vault Transit). Com o vault de
  # referência in-memory as séries não existem, e isso é CORRECTO — o seu apagamento não
  # pode falhar, logo não há pendência possível (ver AOS-322 e DEF-813). Uma regra `absent()`
  # dispararia em todos os deployments de referência.
  prometheus:
    endpoint: "0.0.0.0:9464"
    # Sem sufixo de unidade nem `_total` acrescentado: os nomes que o nó emite são os que este
    # repositório documenta, e reescrevê-los faria as consultas do README deixarem de casar.
    add_metric_suffixes: false
service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
