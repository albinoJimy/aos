# Collector OTLP mínimo — recebe os traces que o nó exporta (AOS_OTLP_ENDPOINT) e imprime-os no
# stdout (exporter debug). Prova que a observabilidade (AOS-173) está LIGADA end-to-end; substitua
# o exporter `debug` por um real (otlp/tempo/jaeger) num deployment a sério.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
