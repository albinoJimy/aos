# Collector — recebe os TRACES que o nó exporta (AOS_OTLP_ENDPOINT) E faz SCRAPE das MÉTRICAS do
# nó (GET /metrics, revisão de prontidão #5). Ambos os pipelines imprimem no stdout (exporter
# debug); num deployment a sério substitua por reais (traces→tempo/jaeger, métricas→prometheus
# remote-write/mimir) e ligue alertas de SLO sobre aos_ready/aos_dsar_vault_ready/aos_eventstore_healthy.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
  # Scrape das métricas do nó em texto Prometheus. O nó serve /metrics em claro na rede interna
  # (mesma perna que o OTLP); restringir por rede num deployment real.
  prometheus:
    config:
      scrape_configs:
        - job_name: aos-node
          scrape_interval: 15s
          static_configs:
            - targets: ["aos:8080"]

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [debug]
