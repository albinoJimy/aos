# Edge de INGRESSO — termina TLS a MONTANTE do nó `aos` (topologia AOS-209).
#
# O nó serve API/SSE/DSAR em CLARO apenas na rede DOCKER INTERNA (não publicada no host) e declara
# AOS_TLS_EXTERNAL_TERMINATION=1: a "responsabilidade assumida" do banner é HONRADA aqui — este
# edge cifra o transporte até ao host. É o mesmo papel de um ingress/malha de serviço em produção
# (lá com um cert de CA real; aqui com um self-signed gerado por up.sh, use `curl -k`).
#
# Porquê o edge e não TLS no próprio nó: o HEALTHCHECK distroless do nó é um probe HTTP simples no
# loopback (deploy/node/healthprobe) e não fala TLS nem faz skip-verify; TLS no nó deixaria o
# container "unhealthy". Terminar TLS no edge mantém o nó saudável E dá TLS real ao host.
worker_processes 1;
events { worker_connections 256; }

http {
  access_log /dev/stdout;
  error_log  /dev/stderr;

  # Resolver DNS do Docker (127.0.0.11) para resolver o nome do serviço `aos` em runtime.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/edge.crt;
    ssl_certificate_key /etc/nginx/tls/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      # Variável => proxy_pass resolve o upstream via `resolver` em cada pedido (não trava o
      # arranque do nginx se o nó ainda estiver a subir).
      set $upstream http://aos:8080;
      proxy_pass $upstream;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto https;

      # SSE (GET /trajectory, streams de observação): sem buffering, ligação longa.
      proxy_buffering off;
      proxy_cache     off;
      proxy_read_timeout 3600s;
    }
  }
}
