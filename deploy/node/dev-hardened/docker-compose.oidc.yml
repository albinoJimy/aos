# =============================================================================
# OVERRIDE de OIDC + PRODUÇÃO — camada sobre docker-compose.yml (balde A).
#
# Adiciona o IdP REAL (Keycloak) e promove o nó a AOS_MODE=production, ligando a CREDENCIAL FORTE
# de soberania (AOS_SOVEREIGN_OIDC_*). O nó passa a EXIGIR um ID-token OIDC verificado (assinatura
# RS256 contra o JWKS do Keycloak) com claim `board` — o header X-Aos-Board auto-declarado deixa de
# autorizar. Fecha o balde B (parte soberania) e desbloqueia a postura de produção.
#
# Uso (traz base + este override):
#   bash deploy/node/dev-hardened/up-oidc.sh
#   docker compose -f docker-compose.yml -f docker-compose.oidc.yml --env-file .env up -d
# =============================================================================
name: aos-dev-hardened

services:
  # --- base de dados PERSISTENTE do Keycloak (PostgreSQL) ---------------------------------------
  # Sem isto o Keycloak cairia na H2 embutida (efémera, dev-only). Com Postgres o realm/utilizadores
  # SOBREVIVEM a recriação do container — a postura production-shaped que um IdP a sério exige.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    environment:
      POSTGRES_DB: "keycloak"
      POSTGRES_USER: "keycloak"
      POSTGRES_PASSWORD: "keycloak-dev-pass"   # DEV; produção usaria um segredo gerido.
    volumes:
      - kc-pgdata:/var/lib/postgresql/data      # persistência real da DB.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro   # cria a DB `litellm` no 1º init.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- IdP REAL: Keycloak, TLS com cert da nossa CA de dev, DB em Postgres ----------------------
  idp:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    mem_limit: 1536m         # Keycloak (JVM) precisa de heap folgado.
    pids_limit: 1024
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      # Base de dados PERSISTENTE (Postgres) em vez da H2 embutida efémera.
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "keycloak-dev-pass"
      # FRONTEND (browser) = localhost:9443 — o único hostname que o browser do host resolve (o
      # SSO da UI do LiteLLM redireciona para aqui). O `iss` dos tokens passa a localhost:9443.
      KC_HOSTNAME: "https://localhost:9443"
      # BACKCHANNEL DINÂMICO: os endpoints de token/JWKS respondem também pelo nome DE REDE (idp:8443)
      # que o NÓ/LiteLLM usam em-rede — resolve o split de hostname browser vs. backend.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "false"              # só https (o nó exige transporte cifrado ao IdP).
      KC_HTTPS_CERTIFICATE_FILE: "/etc/keycloak/tls/idp.crt"
      KC_HTTPS_CERTIFICATE_KEY_FILE: "/etc/keycloak/tls/idp.key"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./secrets/idp-tls:/etc/keycloak/tls:ro
      - ./keycloak/realm-aos.json:/opt/keycloak/data/import/realm-aos.json:ro
    ports:
      - "9443:8443"   # consola/discovery a partir do host (curl -k https://localhost:9443/...).
    depends_on:
      postgres:
        condition: service_healthy

  # --- nó: promovido a PRODUÇÃO + credencial forte de soberania ---------------------------------
  aos:
    environment:
      # Postura de PRODUÇÃO fail-closed. Exige (todas satisfeitas): identidade endurecida
      # (AOS_ISSUER_PUBKEY, base) + AOS_BOARD_REGIONS (base) + sovereign OIDC (abaixo) + TLS
      # (AOS_TLS_EXTERNAL_TERMINATION=1, base, terminado pelo edge).
      AOS_MODE: "production"
      # Credencial FORTE de soberania: o read-path exige ID-token OIDC verificado; o `board` vem
      # das CLAIMS assinadas, não do header. Issuer = nome de rede do Keycloak.
      # iss = frontend (localhost:9443, o que o Keycloak assere); mas o nó NÃO alcança localhost —
      # busca o JWKS explicitamente pelo nome de rede idp:8443 (confia via SSL_CERT_FILE).
      AOS_SOVEREIGN_OIDC_ISSUER: "https://localhost:9443/realms/aos"
      AOS_SOVEREIGN_OIDC_JWKS_URI: "https://idp:8443/realms/aos/protocol/openid-connect/certs"
      AOS_SOVEREIGN_OIDC_AUDIENCE: "aos-node"
      # O nó confia na CA de dev que assinou o cert do Keycloak (Go/Linux honra SSL_CERT_FILE).
      SSL_CERT_FILE: "/etc/aos/idp-ca.crt"

      # CUSTÓDIA EXTERNA DA KEK em HashiCorp Vault (AOS-215/AOS-216), motor Transit: a KEK
      # por-titular vive no Vault (key-never-leaves) e o /dsar/erase destrói-a lá (crypto-shred).
      # Dev: transporte http na rede interna e token por ficheiro; produção usaria https + token
      # de curta duração. Sem estas vars o nó cairia no vault in-memory demo-grade.
      AOS_DSAR_VAULT_ADDR: "https://vault:8200"
      AOS_DSAR_VAULT_TOKEN_PATH: "/etc/aos/vault-token"

      # MODEL GATEWAY (EPIC-06) apontado ao LiteLLM (gateway OpenAI-compatível CONFIG-DRIVEN).
      # O nó compõe o gateway REAL (packages/platform/model-gateway) e chama o LiteLLM em
      # /v1/chat/completions com um nome ALLOWLISTED. O LiteLLM traduz esse nome para o
      # provider/modelo REAL segundo litellm/config.yaml (multi-provider/modelo, externo, SEM
      # código). As keys dos providers vivem em ./secrets/model.env (nunca no nó). Sem key o turno
      # devolve erro do provider; o boot do nó NÃO depende disto (o modelo só é chamado num run).
      AOS_MODEL_ENDPOINT: "http://litellm:4000/v1"
      # Com master key no LiteLLM (UI login), o nó tem de a apresentar como bearer ao gateway.
      AOS_MODEL_API_KEY_PATH: "/etc/aos/litellm-key"
      # Nome pedido ao gateway do nó. Travado pela allowlist ASSINADA embebida (board-eu): só
      # gpt-4o | gpt-4o-mini | text-embedding-3-large. É a fronteira de governança do NÓ; o
      # provider/modelo real a que este nome roteia define-se em litellm/config.yaml (livre).
      AOS_MODEL_NAME: "gpt-4o-mini"

      # ATTESTATION DE DISPOSITIVO WebAuthn (AOS-177): liga o FourEyesGate ao componente de
      # autoridade externo (serviço `attestation`) via cliente HTTP stdlib. Com isto, cada perna de
      # aprovação (POST /runs/{id}/approve) exige attestationObject+clientDataJSON válidos — o
      # enforcement dormente passa a ACTIVO. O CBOR corre no componente externo; o nó fica zero-dep.
      AOS_ATTESTATION_VERIFIER_URL: "https://attestation:8090/verify"
      # REGISTRY DE TOOLS (opt-in, análogo mínimo do EPIC-05): oferece ao modelo a tool `web_post`
      # (→ `cap:http.post`, região eu) e liga o binding de governança que o Reference Monitor avalia.
      # Runs normais não a chamam; quando o objetivo pede uma publicação HTTP, o modelo pede a tool e
      # o RM/PDP MEDEIA-a. Como a autorização originada pelo modelo é UNTRUSTED, o taint-gate NEGA
      # (P4, "untrusted não comanda") — ver demo-pdp-tool-deny.sh. Ver deploy/node/README.md.
      AOS_MODEL_TOOLS: "/etc/aos/model-tools.json"
      # REGISTA as tools acima como catálogo ASSINADO (dev-grade, chave efémera) para a REVALIDAÇÃO
      # do RM as admitir → a decisão passa ao PDP/Cedar (gate seguinte). Sem isto a negação seria na
      # revalidação (tool sem contrato assinado); COM isto a negação de cap:http.post é do taint-gate
      # Cedar (allow_http_post exige taint != untrusted). Ver demo-pdp-taint-gate.sh.
      AOS_MODEL_TOOLS_REGISTER: "1"
      # NÍVEIS DE AUTONOMIA (AOS-087) — o que torna o `escalate` ALCANÇÁVEL e, com ele, o
      # bridge de aprovação humana (AOS-021). L4 = corre por omissão e SÓ escala em risco
      # alto. Como o RiskGate não está na cadeia, a classe de risco chega VAZIA e resolve
      # `danger` (fail-closed) — logo, a este nível, a tool call escala e aguarda aval.
      AOS_AUTONOMY_LEVELS: "agt-aprov:fs=L4"

      # EXECUÇÃO DE TOOLS EM microVM FIRECRACKER REAL (AOS-064). A tool `doc_read` do registry
      # tem um bloco `sandbox` ({command:read, path_arg:doc_id}); com o driver firecracker + a URL
      # do orchestrator, uma tool call PERMITIDA executa numa microVM DEDICADA (fronteira de
      # virtualização de hardware, KVM), lê o documento semeado e devolve o conteúdo. O nó fica
      # ZERO-DEP: fala com o orchestrator por HTTP stdlib (o firecracker/jailer corre lá, não aqui).
      # Sem AOS_SANDBOX_FIRECRACKER_URL, o driver firecracker seria o skeleton (ErrDriverUnavailable).
      AOS_SANDBOX_DRIVER: "firecracker"
      AOS_SANDBOX_FIRECRACKER_URL: "http://firecracker:9100/exec"
    volumes:
      - ./secrets/ca.crt:/etc/aos/idp-ca.crt:ro
      - ./secrets/vault-token:/etc/aos/vault-token:ro
      - ./secrets/litellm-key:/etc/aos/litellm-key:ro
      - ./model-tools/tools.json:/etc/aos/model-tools.json:ro
    depends_on:
      idp:
        condition: service_started
      vault:
        condition: service_started
      attestation:
        condition: service_started
      firecracker:
        condition: service_healthy

  # --- executor de microVM FIRECRACKER (AOS-064) — a integração REAL fora do módulo do nó --------
  # O sandbox.FirecrackerDriver do nó é um skeleton por desenho (ADR-017, zero-dep): a orquestração
  # da microVM (firecracker + jailer + KVM + kernel/rootfs + agente de guest por vsock) vive AQUI,
  # num componente host-side privilegiado, e o nó fala com ele por HTTP stdlib — o mesmo padrão do
  # serviço `attestation`. Por POST /exec arranca UMA microVM dedicada, corre a tool call e devolve
  # o resultado. Precisa de /dev/kvm (virtualização aninhada; presente na VM do Docker Desktop).
  firecracker:
    build:
      context: ../../..
      dockerfile: deploy/node/dev-hardened/firecracker/Dockerfile
    image: aos-firecracker:local
    restart: unless-stopped
    privileged: true            # jailer/tap/loop-mount do rootfs + acesso a /dev/kvm.
    devices:
      - "/dev/kvm:/dev/kvm"
    mem_limit: 1g
    environment:
      FC_ADDR: ":9100"
      FC_SEED_DIR: "/seed"      # documentos semeados no RootFS base read-only da microVM (AOS-066).
    volumes:
      - fc-art:/art             # kernel do guest + rootfs.ext4 (persistem entre restarts).
      - ./firecracker/seed:/seed:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://127.0.0.1:9100/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s         # 1º arranque baixa o kernel e constrói o rootfs.

  # --- componente de autoridade de ATTESTATION WebAuthn (AOS-177) — corre o CBOR fora do nó ------
  # O binário do nó NUNCA pode importar o descodificador CBOR (ADR-017); fala com este serviço por
  # HTTP stdlib (RemoteDeviceAttestationVerifier). MODO DEV: CA auto-gerada + /synth. Em produção
  # passar --ca <raiz FIDO/organizacional> no ENTRYPOINT e a allowlist de AAGUID real.
  attestation:
    build:
      context: ../../..
      dockerfile: deploy/node/dev-hardened/attestation/Dockerfile
    image: aos-attestation:local
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    # HTTPS: o nó recusa http em claro para a attestation (um veredito em claro é manipulável em
    # trânsito). Cert SAN=attestation assinado pela CA de dev (o nó confia nela via SSL_CERT_FILE).
    command: ["serve", "--addr", "0.0.0.0:8090", "--tls-cert", "/etc/attestation/tls.crt", "--tls-key", "/etc/attestation/tls.key"]
    volumes:
      - ./secrets/attestation-tls:/etc/attestation:ro
    expose:
      - "8090"   # só na rede interna do compose; o nó chama https://attestation:8090/verify.

  # --- HashiCorp Vault — custódia externa da KEK por-titular (motor Transit), PERSISTENTE -------
  # Storage `file` num volume nomeado (NÃO -dev): o motor Transit e as KEKs por-titular
  # SOBREVIVEM a restart do container (o -dev perdia-as em memória, partindo o crypto-shred).
  # O init/unseal (1 share/threshold 1 em dev) é tratado pelo up-oidc.sh, que guarda o material
  # em secrets/vault-init.json (git-ignored) e escreve o root token em secrets/vault-token.
  vault:
    image: hashicorp/vault:1.18
    restart: unless-stopped   # sobrevive a reboot; volta SELADO (dados intactos) → up-oidc.sh faz unseal.
    mem_limit: 256m
    pids_limit: 128
    cap_add: [IPC_LOCK]
    environment:
      # TLS: o listener serve https; o CLI interno (healthcheck `vault status`) confia na CA de dev.
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.crt"
    # SÓ `server` — o entrypoint da imagem já injecta -config=/vault/config (o DIRECTÓRIO onde
    # montamos o config.hcl). Passar também -config=<ficheiro> definiria o listener 2x ("address
    # already in use"). O ficheiro montado no dir é lido automaticamente.
    command: ["server"]
    # Healthcheck MEANINGFUL: `vault status` sai 0 só quando INICIALIZADO E UNSEALED (2=selado,
    # 1=erro). Marca o serviço healthy apenas quando a custódia da KEK está de facto operacional —
    # visível na monitorização. Nada depende de vault:healthy (o nó usa service_started), pelo que
    # o estado "selado após restart até o up-oidc.sh fazer unseal" não bloqueia o arranque.
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - vault-data:/vault/file                          # storage PERSISTENTE (dir vault:vault da imagem).
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - ./secrets/vault-tls:/vault/tls:ro               # cert TLS (SAN vault) + ca.crt, gerados por up-oidc.
    ports:
      - "8200:8200"   # API/consola a partir do host (https; X-Vault-Token = token de secrets/vault-token).

  # --- LiteLLM proxy — gateway de modelos EXTERNO e CONFIG-DRIVEN (substitui o OmniRoute) --------
  # Multi-provider/multi-modelo por YAML (litellm/config.yaml); keys dos providers por env
  # (./secrets/model.env). Adicionar/trocar provider ou modelo = editar esses ficheiros, SEM código.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 512
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    env_file:
      - ./secrets/model.env      # MOONSHOT_API_KEY, LITELLM_MASTER_KEY, GENERIC_* (SSO). Git-ignored.
    environment:
      # Bundle COMBINADO (CAs públicas do certifi + a nossa CA de dev): o LiteLLM precisa das
      # públicas p/ o egress real (Moonshot/api.kimi.com) E da CA de dev p/ o SSO backend ao
      # Keycloak (token/userinfo em https://idp:8443). Só a CA de dev quebraria o TLS público.
      # O login (browser) vai a https://localhost:9443 (split de hostname).
      SSL_CERT_FILE: "/etc/litellm/ca-bundle.crt"
      REQUESTS_CA_BUNDLE: "/etc/litellm/ca-bundle.crt"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./secrets/ca-bundle.crt:/etc/litellm/ca-bundle.crt:ro
    ports:
      - "4000:4000"              # endpoint OpenAI + UI a partir do host (http://localhost:4000/ui).
    depends_on:
      postgres:
        condition: service_healthy   # DATABASE_URL (UI/keys) aponta para a MESMA Postgres.

  # --- toolbox on-demand: aos-issuer EM-REDE para o fluxo `mint --assertion` (human OIDC) --------
  # Não arranca no `up` (profile "tools"). Uso:
  #   docker compose ... run --rm issuer mint --key-file /etc/aos/issuer.key \
  #     --assertion <id-token> --oidc-issuer https://idp:8443/realms/aos --oidc-audience aos-node ...
  issuer:
    build:
      context: ../../..
      dockerfile: deploy/node/dev-hardened/issuer-toolbox/Dockerfile
    image: aos-issuer-toolbox:local
    profiles: ["tools"]
    user: "0:0"                      # lê a issuer.key montada (0600) — key de DEV, container efémero.
    environment:
      SSL_CERT_FILE: /etc/aos/idp-ca.crt   # confia na CA que assinou o cert do Keycloak.
    volumes:
      - ./secrets/ca.crt:/etc/aos/idp-ca.crt:ro
      - ./secrets/issuer.key:/etc/aos/issuer.key:ro

# Volumes persistentes: Postgres do Keycloak (realm/utilizadores) e storage do Vault (motor
# Transit + KEKs por-titular). Merge com o `volumes:` da base (aos-data). Apagar com `down -v`
# (perde realm/utilizadores E as KEKs — o crypto-shred fica sem material para destruir).
volumes:
  kc-pgdata:
  vault-data:
  fc-art:   # kernel do guest + rootfs.ext4 da microVM firecracker (evita rebaixar/reconstruir a cada arranque).
